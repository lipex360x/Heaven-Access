- call: page_break
- call: h1
  text: Our presentation
- call: figure
  filename: presentation-route.png
  label: Overview
  caption: A short route through the challenge, the proposal, the live prototype and its evaluation.
  width: 11.6in
- call: page_break
- call: h1
  text: 'Heaven Access: the problem and the proposal'
- call: figure
  filename: problem-proposal-introduction.png
  label: Overview
  caption: Proposed office-building scenario. The hypothesis has not been established by a site audit; hardware
    is simulated.
  width: 11.6in
- call: page_break
- call: h1
  text: 'The challenge: connect approval to the access point'
- call: figure
  filename: problem-story.png
  label: Figure 1
  caption: 'Reported workplace tailgating: The Newsroom (2018). Project hypothesis and method; no prevalence or
    site audit claimed.'
  width: 11.6in
- call: body
  text: 'Irish context: ten encrypted Revenue laptops were stolen after forced entry, then recovered. This illustrates
    consequences, not a failure our visitor QR would necessarily prevent (Data Protection Commissioner, 2012, pp.
    16-17).'
  style:
    font_size: 13pt
    space_after: 4pt
- call: page_break
- call: h1
  text: From discussion and sketch to a focused solution
- call: figure
  filename: solution-options.png
  label: Figure 2
  caption: Qualitative design comparison. The creative process was discussion, a small sketch and option comparison;
    no formal workshop or product/cost evaluation is claimed.
  width: 11.6in
- call: page_break
- call: h1
  text: 'Complete actor flow: request, decision, access and assistance'
- call: figure
  filename: actor-flow.png
  label: Figure 3
  caption: 'Implemented workflow. Solid: visit/scan decisions. Dashed: later revocation or deliberate manual assistance.'
  width: 11.2in
- call: body
  text: Validation checks credential, approval/revocation, destination and the inclusive ±30-minute Dublin window.
    Refusals do not count as openings. Manual release needs a reason and confirmation; its count is separate. Expired/revoked
    visits need a new request.
  style:
    font_size: 13pt
- call: page_break
- call: h1
  text: The working prototype
- call: figure
  filename: prototype-screens.png
  label: Figure 4
  caption: Actual hosted UI captured on 15 November 2026 with fictional data. QR concealed. Gate state captured
    after API authorisation, not a physical-camera test.
  width: 11.2in
- call: body
  text: Approve → private QR → reader → shared eight-second opening → relock. Revoke → saved QR refused.
  style:
    font_size: 16pt
- call: page_break
- call: h1
  text: One shared decision, four demonstration roles
- call: figure
  filename: demo-architecture.png
  label: Figure 5
  caption: Gate and elevator are two views of one simulated device. No real hardware or email integration.
  width: 11.6in
- call: body
  text: https://heaven-access.vercel.app
  style:
    font_size: 16pt
    space_after: 4pt
- call: body
  text: 'Protected views: reception / HeavenDemo-2026! (synthetic demo account). Use fictional data; the private
    visitor pass needs no login.'
  style:
    font_size: 13pt
    space_after: 4pt
- call: page_break
- call: h1
  text: Responsibility follows the design decisions
- call: figure
  filename: responsibility-cards.png
  label: Figure 6
  caption: 'GDPR: European Parliament and Council of the European Union (2016); Irish Data Protection Act: Ireland
    (2018).'
  width: 11.6in
- call: body
  text: 'Data Protection Commission (DPC), n.d.-a to n.d.-d: DPIA, security, lawful processing and transparency.
    ACM (2018), principles 1.2, 1.3 and 1.6: harm, honesty and privacy. Safe escape: Health and Safety Authority
    (n.d.).'
  style:
    font_size: 13pt
    space_after: 4pt
- call: body
  text: No approved live basis, retention/deletion policy or completed DPIA. The demo has no automatic deletion.
  style:
    font_size: 12pt
    space_after: 4pt
- call: page_break
- call: h1
  text: What we demonstrated, and what comes next
- call: figure
  filename: evaluation-story.png
  label: Figure 7
  caption: 'Test evidence: project issue #11, 15 November 2026. Regular-occupant needs were raised by Bella; the
    recurring-credential lifecycle is a proposal.'
  width: 11.6in
- call: body
  text: The implemented scope is temporary visitors in one building. Cross-unit blocking and biometrics are also
    future scope. Staff application login is not an employee entry credential.
  style:
    font_size: 13pt
    space_after: 4pt
