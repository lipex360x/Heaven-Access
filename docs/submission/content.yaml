# Presentation pages do not need a report table of contents.
page_numbers: false
styles:
  h1: {font_family: Arial, font_size: 28pt, color: "#163B50", space_before: 8pt, space_after: 16pt}
  h2: {font_family: Arial, font_size: 20pt, color: "#28665C", space_after: 12pt}
  body: {font_family: Arial, font_size: 18pt, space_after: 14pt}
  bullet: {font_family: Arial, font_size: 17pt, space_after: 12pt, indent_left: 0.2in}
  reference: {font_family: Arial, font_size: 12pt, space_after: 8pt}

sections:
