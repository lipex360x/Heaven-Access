573" y="68.0" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#B9DDD1">THE PROBLEM</text><text x="573" y="121.0" font-family="Arial,sans-serif" font-size="37" font-weight="bold" fill="white">Visitors may reach office floors without their visit being</text><text x="573" y="167.99" font-family="Arial,sans-serif" font-size="37" font-weight="bold" fill="white">checked.</text><text x="573" y="248.0" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="white">We investigate the gap between approval and access validation.</text><rect x="545" y="325" width="1035" height="305" rx="16" fill="#EEF5F3" stroke="none"/><text x="573" y="373.0" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#28665C">THE PROPOSED SOLUTION</text><text x="573" y="425.0" font-family="Arial,sans-serif" font-size="35" font-weight="bold" fill="#163B50">Approve a temporary visit, issue its QR and validate</text><text x="573" y="469.45" font-family="Arial,sans-serif" font-size="35" font-weight="bold" fill="#163B50">destination and time at the checkpoint.</text><text x="573" y="550.0" font-family="Arial,sans-serif" font-size="29" font-weight="normal" fill="#163B50">We demonstrate the gate/elevator opening on screen.</text><text x="573" y="595.0" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#28665C">This is an authorisation simulation, not a physical barrier.</text></svg></body></html>
