<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#28665C"/></marker></defs><rect width="1600" height="650" fill="white"/><text x="20" y="42.0" font-family="Arial,sans-serif" font-size="35" font-weight="bold" fill="#163B50">Stakeholders: who is affected and what they need</text><rect x="20" y="85" width="360" height="150" rx="16" fill="#EEF5F3" stroke="none"/><text x="40" y="125.0" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#28665C">VISITORS</text><text x="40" y="172.0" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#163B50">Clear decisions and</text><text x="40" y="207.56" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#163B50">assisted access.</text><rect x="420" y="85" width="360" height="150" rx="16" fill="#EEF5F3" stroke="none"/><text x="440" y="125.0" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#28665C">RECEPTION / SECURITY</text><text x="440" y="172.0" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#163B50">Controlled decisions and</text><text x="440" y="207.56" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#163B50">reliable records.</text><rect x="820" y="85" width="360" height="150" rx="16" fill="#EEF5F3" stroke="none"/><text x="840" y="125.0" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#28665C">OFFICE OCCUPANTS</text><text x="840" y="172.0" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#163B50">Appropriate access for</text><text x="840" y="207.56" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#163B50">expected visitors.</text><rect x="1220" y="85" width="360" height="150" rx="16" fill="#EEF5F3" stroke="none"/><text x="1240" y="125.0" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#28665C">BUILDING MANAGEMENT</text><text x="1240" y="172.0" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#163B50">Safe operation and</text><text x="1240" y="207.56" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#163B50">viable controls.</text><rect x="20" y="260" width="760" height="245" rx="16" fill="#163B50" stroke="none"/><text x="44" y="305.0" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#B9DDD1">REAL-WORLD SIGNAL</text><text x="44" y="350.0" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="white">RBS workplace tailgating</text><text x="44" y="400.0" font-family="Arial,sans-serif" font-size="30" font-weight="normal" fill="white">People followed authorised staff inside. Security</text><text x="44" y="438.1" font-family="Arial,sans-serif" font-size="30" font-weight="normal" fill="white">interrupted an attempted bicycle theft.</text><rect x="810" y="260" width="770" height="245" rx="16" fill="#EEF5F3" stroke="none"/><text x="834" y="305.0" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#28665C">WHAT THIS DOES NOT PROVE</text><text x="834" y="350.0" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#163B50">A QR does not stop a follower.</text><text x="834" y="400.0" font-family="Arial,sans-serif" font-size="30" font-weight="normal" fill="#163B50">Our hypothesis is the approval-to-validation gap. We</text><text x="834" y="438.1" font-family="Arial,sans-serif" font-size="30" font-weight="normal" fill="#163B50">did not audit a building or measure prevalence.</text><text x="20" y="554.0" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#28665C">Investigation: Dani’s reported experience → desk research → discussion and sketch.</text><text x="20" y="604.0" font-family="Arial,sans-serif" font-size="27" font-weight="normal" fill="#163B50">These needs are our design analysis, not interview findings. Incident prevalence is unknown.</text></svg>