<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#28665C"/></marker></defs><rect width="1600" height="650" fill="white"/><rect x="20" y="15" width="360" height="155" rx="16" fill="#EEF5F3" stroke="none"/><circle cx="58" cy="55" r="20" fill="#28665C"/><text x="50" y="64.0" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="white">1</text><text x="92" y="63.0" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#28665C">Visitor phone</text><text x="44" y="111.0" font-family="Arial,sans-serif" font-size="27" font-weight="normal" fill="#163B50">Request → private QR</text><rect x="420" y="15" width="360" height="155" rx="16" fill="#EEF5F3" stroke="none"/><circle cx="458" cy="55" r="20" fill="#28665C"/><text x="450" y="64.0" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="white">2</text><text x="492" y="63.0" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#28665C">Reception browser</text><text x="444" y="111.0" font-family="Arial,sans-serif" font-size="27" font-weight="normal" fill="#163B50">Approve → revoke</text><rect x="820" y="15" width="360" height="155" rx="16" fill="#EEF5F3" stroke="none"/><circle cx="858" cy="55" r="20" fill="#28665C"/><text x="850" y="64.0" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="white">3</text><text x="892" y="63.0" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#28665C">Camera phone</text><text x="844" y="111.0" font-family="Arial,sans-serif" font-size="27" font-weight="normal" fill="#163B50">/device/reader</text><rect x="1220" y="15" width="360" height="155" rx="16" fill="#EEF5F3" stroke="none"/><circle cx="1258" cy="55" r="20" fill="#28665C"/><text x="1250" y="64.0" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="white">4</text><text x="1292" y="63.0" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#28665C">Tablet display</text><text x="1244" y="111.0" font-family="Arial,sans-serif" font-size="27" font-weight="normal" fill="#163B50">Gate or elevator</text><path d="M200 175L200 240" fill="none" stroke="#28665C" stroke-width="3" marker-end="url(#a)" /><path d="M600 175L600 240" fill="none" stroke="#28665C" stroke-width="3" marker-end="url(#a)" /><path d="M1000 175L1000 240" fill="none" stroke="#28665C" stroke-width="3" marker-end="url(#a)" /><path d="M1400 175V215H1100V240" fill="none" stroke="#28665C" stroke-width="3" marker-end="url(#a)"/><rect x="20" y="245" width="1170" height="180" rx="16" fill="#163B50" stroke="none"/><text x="48" y="290.0" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#B9DDD1">ONE CENTRAL ACCESS DECISION</text><text x="48" y="337.0" font-family="Arial,sans-serif" font-size="31" font-weight="normal" fill="white">The server checks approval, revocation, destination and visit time.</text><text x="48" y="390.0" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="white">Reception, the reader and the display share the same result.</text><rect x="1250" y="245" width="330" height="180" rx="16" fill="#EEF5F3" stroke="none"/><text x="1280" y="305.0" font-family="Arial,sans-serif" font-size="31" font-weight="bold" fill="#28665C">Access history</text><text x="1280" y="355.0" font-family="Arial,sans-serif" font-size="27" font-weight="normal" fill="#163B50">Visits + decisions</text><path d="M1193 335L1245 335" fill="none" stroke="#28665C" stroke-width="3" marker-end="url(#a)" /><rect x="20" y="465" width="1560" height="165" rx="16" fill="#EEF5F3" stroke="none"/><text x="44" y="508.0" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#28665C">Live sequence</text><text x="44" y="553.0" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#163B50">Request → pending → approve → QR scan → open 8s → relock</text><text x="44" y="602.0" font-family="Arial,sans-serif" font-size="29" font-weight="normal" fill="#163B50">Then confirm revocation and retry the saved QR: refusal, with earlier history preserved.</text></svg>