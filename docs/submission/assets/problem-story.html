<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:1600px;height:650px;overflow:hidden}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#28665C"/></marker></defs><rect width="1600" height="650" fill="white"/><text x="20" y="42.0" font-family="Arial,sans-serif" font-size="35" font-weight="bold" fill="#163B50">A visit must be connected to a permission at the checkpoint.</text><rect x="20" y="85" width="490" height="140" rx="16" fill="#EEF5F3" stroke="none"/><text x="44" y="128.0" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#28665C">VISITOR</text><text x="44" y="174.0" font-family="Arial,sans-serif" font-size="29" font-weight="normal" fill="#163B50">Arrives at an office building</text><rect x="555" y="85" width="490" height="140" rx="16" fill="#EEF5F3" stroke="none"/><text x="579" y="128.0" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#28665C">RECEPTION</text><text x="579" y="174.0" font-family="Arial,sans-serif" font-size="29" font-weight="normal" fill="#163B50">Reviews the intended visit</text><rect x="1090" y="85" width="490" height="140" rx="16" fill="#EEF5F3" stroke="none"/><text x="1114" y="128.0" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#28665C">ACCESS POINT</text><text x="1114" y="174.0" font-family="Arial,sans-serif" font-size="29" font-weight="normal" fill="#163B50">Checks destination and time</text><path d="M513 155L550 155" fill="none" stroke="#28665C" stroke-width="3" marker-end="url(#a)" stroke-dasharray="8 6"/><path d="M1048 155L1085 155" fill="none" stroke="#28665C" stroke-width="3" marker-end="url(#a)" stroke-dasharray="8 6"/><rect x="20" y="260" width="760" height="245" rx="16" fill="#163B50" stroke="none"/><text x="44" y="305.0" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#B9DDD1">REAL-WORLD SIGNAL</text><text x="44" y="350.0" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="white">RBS workplace tailgating</text><text x="44" y="400.0" font-family="Arial,sans-serif" font-size="30" font-weight="normal" fill="white">People followed authorised staff inside. Security</text><text x="44" y="438.1" font-family="Arial,sans-serif" font-size="30" font-weight="normal" fill="white">interrupted an attempted bicycle theft.</text><rect x="810" y="260" width="770" height="245" rx="16" fill="#EEF5F3" stroke="none"/><text x="834" y="305.0" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#28665C">WHAT THIS DOES NOT PROVE</text><text x="834" y="350.0" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#163B50">A QR does not stop a follower.</text><text x="834" y="400.0" font-family="Arial,sans-serif" font-size="30" font-weight="normal" fill="#163B50">Our hypothesis is the approval-to-validation gap. We</text><text x="834" y="438.1" font-family="Arial,sans-serif" font-size="30" font-weight="normal" fill="#163B50">did not audit a building or measure prevalence.</text><text x="20" y="554.0" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#28665C">Investigation: Dani’s reported experience → desk research → discussion and sketch.</text><text x="20" y="604.0" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#163B50">Affected: visitors • reception/security • occupants • building management</text></svg></body></html>
