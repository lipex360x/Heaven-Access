<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:1600px;height:650px;overflow:hidden}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#28665C"/></marker></defs><rect width="1600" height="650" fill="white"/><rect x="20" y="15" width="760" height="260" rx="16" fill="#EEF5F3" stroke="none"/><text x="44" y="60.0" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#28665C">VERIFIED WORKFLOW</text><text x="44" y="110.0" font-family="Arial,sans-serif" font-size="31" font-weight="bold" fill="#163B50">Approve • open / relock • revoke • refuse</text><text x="44" y="165.0" font-family="Arial,sans-serif" font-size="29" font-weight="normal" fill="#163B50">Recorded tests: 7 unit, 10 visitor/auth, 9 device; 5</text><text x="44" y="201.82999999999998" font-family="Arial,sans-serif" font-size="29" font-weight="normal" fill="#163B50">browser locally + 5 online.</text><text x="44" y="244.0" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#163B50">Browser video was synthetic, not a physical-camera test.</text><rect x="810" y="15" width="770" height="260" rx="16" fill="#163B50" stroke="none"/><text x="834" y="60.0" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#B9DDD1">WHAT REMAINS UNPROVEN</text><text x="834" y="110.0" font-family="Arial,sans-serif" font-size="31" font-weight="bold" fill="white">Identity • passage • tailgating prevention</text><text x="834" y="170.0" font-family="Arial,sans-serif" font-size="29" font-weight="normal" fill="white">No measured incident reduction or verified integration</text><text x="834" y="206.82999999999998" font-family="Arial,sans-serif" font-size="29" font-weight="normal" fill="white">cost. Access counts are not occupancy.</text><rect x="20" y="310" width="760" height="315" rx="16" fill="#EEF5F3" stroke="none"/><text x="44" y="355.0" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#28665C">SUSTAINABILITY IS A TRADE-OFF</text><text x="44" y="405.0" font-family="Arial,sans-serif" font-size="31" font-weight="bold" fill="#163B50">Potential: fewer paper passes.</text><text x="44" y="457.0" font-family="Arial,sans-serif" font-size="29" font-weight="normal" fill="#163B50">Balance against devices, hosting, installation,</text><text x="44" y="493.83" font-family="Arial,sans-serif" font-size="29" font-weight="normal" fill="#163B50">maintenance and replacement.</text><text x="44" y="576.0" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#28665C">No net environmental saving measured.</text><rect x="810" y="310" width="770" height="315" rx="16" fill="#EEF5F3" stroke="none"/><text x="834" y="355.0" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#28665C">BELLA’S QUESTION</text><text x="834" y="405.0" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#163B50">What about regular occupants?</text><text x="834" y="458.0" font-family="Arial,sans-serif" font-size="29" font-weight="normal" fill="#163B50">Future recurring permissions: destinations + schedules</text><text x="834" y="494.83" font-family="Arial,sans-serif" font-size="29" font-weight="normal" fill="#163B50">+ review + revocation.</text><text x="834" y="576.0" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#28665C">Not an unlimited visitor QR; not implemented.</text></svg></body></html>
