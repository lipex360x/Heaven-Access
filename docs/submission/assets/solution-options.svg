<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#28665C"/></marker></defs><rect width="1600" height="650" fill="white"/><rect x="20" y="15" width="490" height="145" rx="16" fill="#EEF5F3" stroke="none"/><circle cx="58" cy="55" r="20" fill="#28665C"/><text x="50" y="64.0" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="white">1</text><text x="92" y="63.0" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#28665C">Discuss + sketch</text><text x="44" y="111.0" font-family="Arial,sans-serif" font-size="27" font-weight="normal" fill="#163B50">Start from Dani’s workplace</text><text x="44" y="145.29" font-family="Arial,sans-serif" font-size="27" font-weight="normal" fill="#163B50">scenario.</text><rect x="555" y="15" width="490" height="145" rx="16" fill="#EEF5F3" stroke="none"/><circle cx="593" cy="55" r="20" fill="#28665C"/><text x="585" y="64.0" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="white">2</text><text x="627" y="63.0" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#28665C">Compare alternatives</text><text x="579" y="111.0" font-family="Arial,sans-serif" font-size="27" font-weight="normal" fill="#163B50">Test the fit, dependencies and risks.</text><rect x="1090" y="15" width="490" height="145" rx="16" fill="#EEF5F3" stroke="none"/><circle cx="1128" cy="55" r="20" fill="#28665C"/><text x="1120" y="64.0" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="white">3</text><text x="1162" y="63.0" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#28665C">Combine + simplify</text><text x="1114" y="111.0" font-family="Arial,sans-serif" font-size="27" font-weight="normal" fill="#163B50">Approval + QR + server checkpoint.</text><rect x="20" y="192" width="296" height="230" rx="16" fill="#EEF5F3" stroke="none"/><text x="38" y="234.0" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#28665C">Process only</text><text x="38" y="278.0" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#163B50">Sign-in / signage</text><text x="38" y="348.0" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#163B50">Depends on human</text><text x="38" y="381.02" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#163B50">compliance.</text><rect x="336" y="192" width="296" height="230" rx="16" fill="#EEF5F3" stroke="none"/><text x="354" y="234.0" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#28665C">QR only</text><text x="354" y="278.0" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#163B50">Registration / pass</text><text x="354" y="348.0" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#163B50">Leaves physical</text><text x="354" y="381.02" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#163B50">bypass routes.</text><rect x="652" y="192" width="296" height="230" rx="16" fill="#D7E8E2" stroke="none"/><text x="670" y="234.0" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#28665C">Lift interface</text><text x="670" y="278.0" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#163B50">Destination permission</text><text x="670" y="348.0" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#163B50">Vendor compatibility</text><text x="670" y="381.02" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#163B50">required.</text><rect x="968" y="192" width="296" height="230" rx="16" fill="#EEF5F3" stroke="none"/><text x="986" y="234.0" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#28665C">Turnstile</text><text x="986" y="278.0" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#163B50">Physical checkpoint</text><text x="986" y="348.0" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#163B50">Installation and safety</text><text x="986" y="381.02" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#163B50">review.</text><rect x="1284" y="192" width="296" height="230" rx="16" fill="#EEF5F3" stroke="none"/><text x="1302" y="234.0" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#28665C">Camera detection</text><text x="1302" y="278.0" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#163B50">Tailgating detection</text><text x="1302" y="348.0" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#163B50">Privacy and accuracy</text><text x="1302" y="381.02" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#163B50">questions.</text><rect x="20" y="455" width="1560" height="175" rx="16" fill="#163B50" stroke="none"/><text x="46" y="500.0" font-family="Arial,sans-serif" font-size="32" font-weight="bold" fill="white">Chosen for the prototype: one joined authorisation workflow, with simulated hardware.</text><text x="46" y="554.0" font-family="Arial,sans-serif" font-size="29" font-weight="normal" fill="white">For deployment: suitable lift interface? Investigate it. If unavailable, assess a specialised turnstile.</text><text x="46" y="603.0" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#B9DDD1">No confirmed hardware compatibility, installation approval or verified cost.</text></svg>